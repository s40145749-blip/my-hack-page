<div id="hackerIntro">
  <div id="code"></div>
</div>

<div id="hackedSticker">☠ HACKED ☠</div>

<style>
#hackerIntro {
  position: fixed;
  inset: 0;
  background: #000;
  color: #00ff41;
  z-index: 999999;
  overflow: hidden;
  font-family: monospace;
  font-size: 16px;
  padding: 25px;
}

#code {
  line-height: 1.6;
  white-space: pre-wrap;
  animation: scrollCode 7s linear forwards;
}

@keyframes scrollCode {
  from { transform: translateY(100vh); }
  to { transform: translateY(-120vh); }
}

#hackedSticker {
  display: none;
  position: fixed;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-8deg);
  z-index: 1000000;
  padding: 20px 35px;
  background: #8b0000;
  color: white;
  border: 4px solid white;
  border-radius: 12px;
  font: bold 42px Arial;
  box-shadow: 0 0 35px red;
  animation: scary 0.25s infinite alternate;
}

@keyframes scary {
  from { transform: translate(-50%, -50%) rotate(-8deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(8deg) scale(1.08); }
}
</style>

<script>
const lines = [
  "INITIALIZING SYSTEM...",
  "ACCESSING MAIN SERVER...",
  ">>> CONNECTION ESTABLISHED",
  "BYPASSING SECURITY...",
  "ENCRYPTION DETECTED",
  "CRACKING FIREWALL...",
  "ACCESS GRANTED",
  "DOWNLOADING DATA...",
  "SYSTEM COMPROMISED",
  "WARNING: UNKNOWN USER",
  "ROOT ACCESS: GRANTED",
  "████████████████████",
  "YOU ARE BEING WATCHED...",
  "ERROR 666",
  "HACK COMPLETE..."
];

let code = "";
for (let i = 0; i < 25; i++) {
  code += lines[Math.floor(Math.random() * lines.length)] + "\n";
}
document.getElementById("code").textContent = code;

setTimeout(() => {
  document.getElementById("hackerIntro").style.display = "none";
  document.getElementById("hackedSticker").style.display = "block";
}, 7000);
</script>
